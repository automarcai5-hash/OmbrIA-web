<style>
:root {
  --marca: #1f3a5f;
  --acento: #e4572e;
  --tinta: #1d232b;
  --suave: #5b6573;
  --linea: #dfe3e8;
  --fondo: #f5f6f8;
  --papel: #fff;
  --ok: #067647;
  --aviso: #b54708;
  --aviso-fondo: #fffaeb;
  --sugerido: #fff6d5;
  --radio: 12px;
  --letra: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font: 16px/1.5 var(--letra); color: var(--tinta); background: var(--fondo); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--marca); }
h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
p { margin: 0 0 .9em; }
.suave { color: var(--suave); }
.oculto { display: none !important; }

/* ---------- estructura ---------- */
.cabecera { background: var(--marca); color: #fff; }
.cabecera-in { max-width: 1180px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 14px; }
.cabecera img { height: 34px; max-width: 150px; object-fit: contain; background: #fff; border-radius: 6px; padding: 3px; }
.cabecera-txt { flex: 1; min-width: 0; }
.cabecera-txt b { display: block; }
.cabecera-txt span { font-size: .85rem; opacity: .8; }
.guardado { font-size: .78rem; opacity: .85; white-space: nowrap; }
.enviar-avance { background: #fff; color: var(--marca); border: 0; border-radius: 8px; padding: 7px 12px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.enviar-avance:hover { opacity: .9; }
.marco { max-width: 1180px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 250px 1fr; gap: 24px; align-items: start; }
.lateral { position: sticky; top: 16px; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 10px; }
.lateral ol { list-style: none; margin: 0; padding: 0; }
.lateral li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: .92rem; }
.lateral li button:hover { background: var(--fondo); }
.lateral li button.actual { background: color-mix(in srgb, var(--marca) 10%, white); font-weight: 600; color: var(--marca); }
.lateral .num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; border: 1.5px solid var(--linea); flex: none; }
.lateral .hecho .num { background: var(--ok); border-color: var(--ok); color: #fff; }
.lateral .otra { opacity: .55; }
.lateral .otra small { display: block; font-size: .7rem; }
.progreso { height: 6px; background: var(--fondo); border-radius: 3px; overflow: hidden; margin: 10px 4px 4px; }
.progreso div { height: 100%; background: var(--acento); transition: width .3s; }
.progreso-txt { font-size: .75rem; color: var(--suave); margin: 0 4px 4px; }
.contenido, .lateral { min-width: 0; }
.seccion { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 28px; }
.seccion > h2 { margin-bottom: .25em; }
.intro { color: var(--suave); max-width: 720px; }
.bloque { border-top: 1px solid var(--linea); margin-top: 24px; padding-top: 20px; }
.bloque > h3 { margin-bottom: .2em; }
.bloque > .ayuda { margin-bottom: 14px; }
.navegacion { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }

/* ---------- campos ---------- */
.campo { margin: 0 0 18px; }
.campo > label, .campo > .etiqueta { display: block; font-weight: 600; margin-bottom: 6px; }
.campo .opcional { font-weight: 400; color: var(--suave); font-size: .85rem; }
.ayuda { font-size: .85rem; color: var(--suave); margin: -2px 0 8px; }
input[type=text], input[type=number], input[type=email], select, textarea { width: 100%; border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; background: #fff; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 18%, transparent); }
textarea { min-height: 76px; resize: vertical; }
.fila { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.op { position: relative; }
.op input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.op span { display: inline-block; border: 1px solid var(--linea); background: #fff; border-radius: 20px; padding: 7px 14px; font-size: .9rem; cursor: pointer; user-select: none; }
.op input:checked + span { background: var(--marca); border-color: var(--marca); color: #fff; }
.op input:focus-visible + span { box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 25%, transparent); }
.op.nose span { border-style: dashed; }
.casilla { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.casilla input { margin-top: 4px; width: 18px; height: 18px; flex: none; }

.boton { border: 1px solid var(--linea); background: #fff; border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 600; font-size: .92rem; }
.boton:hover { border-color: var(--marca); color: var(--marca); }
.boton.principal { background: var(--marca); border-color: var(--marca); color: #fff; }
.boton.principal:hover { filter: brightness(1.1); color: #fff; }
.boton.acento { background: var(--acento); border-color: var(--acento); color: #fff; }
.boton.peligro:hover { border-color: #b42318; color: #b42318; }
.boton.peque { padding: 5px 10px; font-size: .8rem; border-radius: 8px; font-weight: 500; }
.boton:disabled { opacity: .5; cursor: default; }
.icono { border: 0; background: none; cursor: pointer; padding: 4px 7px; border-radius: 6px; color: var(--suave); font-size: .95rem; }
.icono:hover { background: var(--fondo); color: var(--tinta); }
.rapidos { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
.rapidos button { border: 1px dashed #b8c0ca; background: #fff; border-radius: 16px; padding: 4px 12px; font-size: .85rem; cursor: pointer; }
.rapidos button:hover { border-color: var(--marca); color: var(--marca); }
.rapidos button[disabled] { opacity: .4; cursor: default; }

/* ---------- tarjetas de lista ---------- */
.tarjeta { border: 1px solid var(--linea); border-radius: 10px; padding: 14px; margin-bottom: 10px; background: #fff; }
.tarjeta-cab { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.tarjeta-cab input[type=text] { font-weight: 600; }
.tarjeta-cab .acciones { margin-left: auto; display: flex; gap: 2px; }
details.mas { margin-top: 8px; }
details.mas > summary { cursor: pointer; font-size: .85rem; color: var(--marca); font-weight: 600; }
details.mas[open] > summary { margin-bottom: 12px; }

/* ---------- procesos ---------- */
.catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.proc-op { border: 1px solid var(--linea); border-radius: 10px; padding: 12px 14px; background: #fff; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
.proc-op:hover { border-color: var(--marca); }
.proc-op.elegido { border-color: var(--marca); background: color-mix(in srgb, var(--marca) 6%, white); }
.proc-op input { margin-top: 4px; width: 18px; height: 18px; flex: none; }
.proc-op b { display: block; font-size: .95rem; }
.proc-op small { color: var(--suave); font-size: .82rem; display: block; }
.proc-op .tipico { display: inline-block; font-size: .7rem; font-weight: 700; color: var(--ok); background: #ecfdf3; border-radius: 4px; padding: 0 6px; margin-top: 4px; }
.proceso { border: 1px solid var(--linea); border-radius: var(--radio); margin: 14px 0; background: #fff; overflow: hidden; }
.proceso > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; gap: 12px; align-items: center; background: #fafbfc; }
.proceso > summary::-webkit-details-marker { display: none; }
.proceso > summary::before { content: "▸"; color: var(--suave); transition: transform .2s; }
.proceso[open] > summary::before { transform: rotate(90deg); }
.proceso > summary b { flex: 1; }
.estado { font-size: .75rem; font-weight: 700; border-radius: 12px; padding: 2px 9px; white-space: nowrap; }
.estado.vacio { background: var(--fondo); color: var(--suave); }
.estado.medias { background: var(--aviso-fondo); color: var(--aviso); }
.estado.listo { background: #ecfdf3; color: var(--ok); }
.proceso-cuerpo { padding: 6px 18px 18px; }
.paso { border: 1px solid var(--linea); border-left: 4px solid var(--marca); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
.paso.decision { border-left-color: #f59e0b; }
.paso.espera { border-left-color: #94a3b8; }
.paso.comunicacion { border-left-color: #0ea5e9; }
.paso.sugerido { background: var(--sugerido); }
.paso-cab { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.paso-num { width: 28px; height: 28px; border-radius: 50%; background: var(--marca); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; flex: none; }
.decision .paso-num { background: #f59e0b; }
.tipos { display: inline-flex; border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; }
.tipos button { border: 0; background: #fff; padding: 5px 10px; font-size: .8rem; cursor: pointer; border-right: 1px solid var(--linea); }
.tipos button:last-child { border-right: 0; }
.tipos button.activo { background: var(--tinta); color: #fff; }
.paso-cab .acciones { margin-left: auto; display: flex; }
.etq-sugerido { font-size: .72rem; font-weight: 700; background: #fde68a; color: #92400e; border-radius: 4px; padding: 1px 7px; }
.opcion-dec { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; align-items: start; margin-bottom: 8px; }
.opcion-dec .fin-txt { grid-column: 2 / 3; }
.avisito { font-size: .8rem; color: var(--aviso); background: var(--aviso-fondo); border-radius: 6px; padding: 4px 8px; margin-top: 6px; }
.relato { background: #f8fafc; border: 1px solid var(--linea); border-radius: 10px; padding: 14px 18px; font-size: .95rem; }
.relato ol { margin: .4em 0 .6em; padding-left: 1.3em; }
.relato li { margin-bottom: 3px; }
.relato .dec { list-style: none; margin-left: -1.3em; color: #92400e; }
.confirmado { color: var(--ok); font-weight: 700; }
.area-ajena { background: var(--aviso-fondo); border-radius: 10px; padding: 14px 18px; margin: 16px 0; }

/* ---------- revisión ---------- */
.revision li { margin-bottom: 4px; }
.revision .ok { color: var(--ok); }
.revision .falta { color: var(--aviso); }
.acciones-envio { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
.nota-envio { background: #ecfdf3; border-radius: 10px; padding: 14px 18px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: .9rem; z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,.2); }

@media (max-width: 860px) {
  .marco { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
  .lateral { position: static; }
  .lateral ol { display: flex; overflow-x: auto; gap: 4px; }
  .lateral li button { white-space: nowrap; padding: 6px 8px; }
  .lateral li button .txt { display: none; }
  .lateral li button.actual .txt { display: inline; }
  .seccion { padding: 18px 16px; }
  .opcion-dec { grid-template-columns: 1fr; }
  .opcion-dec .fin-txt { grid-column: auto; }
  .proceso-cuerpo { padding: 6px 12px 14px; }
  .guardado { display: none; }
}
@media print {
  .lateral, .navegacion, .boton, .icono, .rapidos, .tipos, .cabecera .guardado, .enviar-avance { display: none !important; }
  .marco { display: block; padding: 0; }
  .seccion { border: 0; padding: 0; }
  details { display: block; }
  details > * { display: block !important; }
}
</style>
</head>

  /* El relato que el cliente lee para confirmar que se ha entendido (playback). */
  function relato(p) {
    var pasos = p.pasos || [];
    if (!pasos.length) return '<div class="relato suave">Cuando añadas pasos, aquí aparecerá tu proceso contado de principio a fin.</div>';
    var disp = p.disparador || {};
    var inicio = (disp.texto || etiqueta(O.disparador, disp.tipo) || 'algo que no has dicho todavía').replace(/\.$/, '');
    var idx = {}; pasos.forEach(function (s, k) { idx[s.id] = k + 1; });
    var destino = function (o) {
      var d = o.destino || 'siguiente';
      if (d === 'siguiente') return 'sigue con el paso siguiente';
      if (d === 'fin') return 'termina' + (o.fin ? ' («' + esc(o.fin) + '»)' : '');
      if (d.indexOf('paso:') === 0) return 'vuelve o salta al paso ' + (idx[d.slice(5)] || '?');
      if (d.indexOf('proceso:') === 0) { var x = todosProcesos().filter(function (y) { return y.p.id === d.slice(8); })[0]; return 'termina y pasa a «' + esc(x ? x.p.nombre : 'otro proceso') + '»'; }
      return '';
    };
    var lis = pasos.map(function (s, k) {
      var t = s.tipo || 'tarea';
      if (t === 'decision') {
        var dec = s.decision || {};
        return '<li class="dec">◆ <b>' + esc(dec.pregunta || s.que || '¿…?') + '</b>' + (s.quien ? ' (decide ' + esc(nombreQuien(s.quien)) + ')' : '') + ': ' + (dec.opciones || []).map(function (o) { return 'si «' + esc(o.texto || '…') + '», ' + destino(o); }).join('; ') + '.</li>';
      }
      if (t === 'espera') return '<li>Se espera' + (s.espera ? ' ' + esc(s.espera) : '') + (s.que ? ' (' + esc(s.que.toLowerCase()) + ')' : '') + '.</li>';
      var quien = s.quien ? nombreQuien(s.quien) : '<i>alguien (falta decir quién)</i>';
      var con = (s.con || []).map(nombreHerr).filter(Boolean);
      var com = t === 'comunicacion' && s.comunicacion ? ' — ' + (s.comunicacion.sentido === 'recibe' ? 'se recibe de ' : 'se envía a ') + esc(s.comunicacion.con === 'cliente' || !s.comunicacion.con ? 'el cliente' : nombreQuien(s.comunicacion.con)) : '';
      return '<li><b>' + esc(quien.charAt(0).toUpperCase() + quien.slice(1)) + '</b>: ' + esc((s.que || '…').charAt(0).toLowerCase() + (s.que || '…').slice(1)) + (con.length ? ', con ' + esc(con.join(' y ')) : '') + (s.tiempo && s.tiempo !== 'nose' ? ' (' + esc(etiqueta(O.tiempo, s.tiempo)) + ')' : '') + com + '.</li>';
    }).join('');
    var sig = p.siguiente ? todosProcesos().filter(function (y) { return y.p.id === p.siguiente; })[0] : null;
    return '<div class="relato"><p style="margin:0">Empieza cuando <b>' + esc(inicio.charAt(0).toLowerCase() + inicio.slice(1)) + '</b>.</p><ol>' + lis + '</ol><p style="margin:0">Termina cuando <b>' + esc((p.resultado || 'no lo has dicho todavía').replace(/\.$/, '')) + '</b>' + (sig ? ', y entonces empieza «' + esc(sig.p.nombre) + '»' : '') + '.</p></div>';
  }

  function revision() {
    var l = [];
    var ok = function (t) { l.push('<li class="ok">✓ ' + t + '</li>'); };
    var falta = function (t) { l.push('<li class="falta">! ' + t + '</li>'); };
    if (E.empresa.nombre) ok('Empresa: ' + esc(E.empresa.nombre)); else falta('Falta el nombre de la empresa.');
    if (E.equipo.length) ok(E.equipo.length + ' puestos en el equipo'); else falta('No has añadido ningún puesto en «Quién trabaja».');
    if (E.herramientas.length) ok(E.herramientas.length + ' herramientas'); else falta('No has añadido herramientas.');
    AREAS.forEach(function (a) {
      var ps = E.areas[a.id].procesos;
      var mia = areasMias().indexOf(a.id) >= 0;
      if (!ps.length) { if (mia) falta(a.nombre + ': no has marcado ningún proceso.'); return; }
      ps.forEach(function (p) {
        var est = estadoProceso(p);
        var detalles = [];
        var pasos = p.pasos || [];
        if (!pasos.length) detalles.push('sin pasos');
        var sinQuien = pasos.filter(function (s) { return s.tipo !== 'espera' && !s.quien; }).length;
        if (sinQuien) detalles.push(sinQuien + ' paso' + (sinQuien > 1 ? 's' : '') + ' sin quién');
        if (pasos.some(function (s) { return s.sugerido; })) detalles.push('pasos sugeridos sin confirmar');
        if (!p.resultado) detalles.push('falta cómo termina');
        if (!(p.disparador || {}).tipo) detalles.push('falta cómo empieza');
        if (pasos.length && !p.confirmado) detalles.push('falta confirmar el resumen');
        if (est[0] === 'listo') ok(a.nombre + ' · ' + esc(p.nombre)); else falta(a.nombre + ' · ' + esc(p.nombre) + ': ' + detalles.join(', ') + '.');
      });
    });
    if (activo('seguridad')) { if (E.seguridad.dos_pasos || E.seguridad.copias) ok('Seguridad'); else falta('Datos y seguridad sin contestar (son 2 minutos).'); }
    EXTRAS.filter(function (q) { return q.obligatoria; }).forEach(function (q) {
      var v = (E.extra || {})[q.id];
      if (v === undefined || v === '' || (Array.isArray(v) && !v.length)) falta('Falta contestar: «' + esc(q.pregunta) + '».');
    });
    return '<ul class="revision">' + l.join('') + '</ul>';
  }

  function seccionHecha(id) {
    if (id === 'inicio') return !!E.respondente.nombre;
    if (id === 'empresa') return !!(E.empresa.nombre && E.empresa.actividad);
    if (id === 'equipo') return E.equipo.length > 0;
    if (id === 'herramientas') return E.herramientas.length > 0;
    if (id === 'seguridad') return activo('seguridad') ? !!(E.seguridad.dos_pasos && E.seguridad.copias) : !!E.ia.uso;
    if (id === 'enviar') return false;
    var ps = E.areas[id].procesos;
    return ps.length > 0 && ps.every(function (p) { return estadoProceso(p)[0] === 'listo'; });
  }
  function pintarIndice() {
    var hechas = 0;
    var mias = SECCIONES.filter(function (s) { return !s.area || areasMias().indexOf(s.id) >= 0; });
    document.getElementById('indice').innerHTML = SECCIONES.map(function (s, k) {
      var hecha = seccionHecha(s.id); if (hecha && mias.indexOf(s) >= 0) hechas++;
      var otra = s.area && areasMias().indexOf(s.id) < 0;
      return '<li class="' + (hecha ? 'hecho ' : '') + (otra ? 'otra' : '') + '"><button type="button" data-ir="' + s.id + '" class="' + (UI.seccion === s.id ? 'actual' : '') + '"><span class="num">' + (hecha ? '✓' : k + 1) + '</span><span class="txt">' + s.nombre + (otra ? '<small>la contesta otra persona</small>' : '') + '</span></button></li>';
    }).join('');
    var total = mias.length - 1;
    var pct = Math.round(hechas / total * 100);
    document.getElementById('barra').style.width = pct + '%';
    document.getElementById('progreso-txt').textContent = pct + ' % completado';
  }
  function pintar(mantenerScroll) {
    var y = window.scrollY;
    var activo = document.activeElement;
    var campoActivo = activo && (activo.getAttribute('data-campo') || '');
    var abiertos = {};
    document.querySelectorAll('details[data-mas-id]').forEach(function (d) { abiertos[d.getAttribute('data-mas-id')] = d.open; });
    var s = SECCIONES.filter(function (x) { return x.id === UI.seccion; })[0] || SECCIONES[0];
    var html = s.area ? RENDER.area(s.id) : RENDER[s.id]();
    var extras = bloqueExtras(s.id);
    if (extras) html = html.replace(/<\/section>\s*$/, extras + '</section>');
    document.getElementById('seccion').innerHTML = html;
    // Recordar qué desplegables de detalle estaban abiertos.
    var k = 0;
    document.querySelectorAll('#seccion details.mas').forEach(function (d) {
      var id = UI.seccion + ':' + (k++);
      d.setAttribute('data-mas-id', id);
      if (abiertos[id]) d.open = true;
    });
    pintarIndice();
    var idx = SECCIONES.indexOf(s);
    document.getElementById('anterior').style.visibility = idx === 0 ? 'hidden' : 'visible';
    document.getElementById('siguiente').style.visibility = idx === SECCIONES.length - 1 ? 'hidden' : 'visible';
    if (mantenerScroll) {
      window.scrollTo(0, y);
      if (campoActivo) { var el = document.querySelector('[data-campo="' + campoActivo + '"]'); if (el && el.type !== 'radio') { el.focus(); } }
    }
  }

  /* ---------- acciones ---------- */
  function proc(area, i) { return E.areas[area].procesos[+i]; }
  function pasoVacio(lista) { return { id: sigId(lista, 's'), que: '', quien: '', con: [], tipo: 'tarea' }; }
  function cargarPlantilla(area, i) {
    var p = proc(area, i);
    var pl = (CATALOGO.procesos || []).filter(function (x) { return x.id === p.plantilla; })[0];
    if (!pl) return;
    var externoPor = function (clave) {
      var re = clave === 'gestoria' ? /gestor|asesor/i : /proveedor|almac|distrib/i;
      var x = E.externos.filter(function (y) { return re.test(y.nombre || '') || re.test(y.que_hace || ''); })[0];
      return x ? x.id : '';
    };
    p.pasos = pl.pasos.map(function (s, k) {
      var n = { id: 's' + (k + 1), que: s.que, quien: '', con: [], tipo: s.tipo, sugerido: true };
      if (s.tipo === 'decision') n.decision = { pregunta: s.pregunta || s.que, opciones: (s.opciones || []).map(function (o) { return { texto: o.texto, destino: o.destino ? o.destino.replace(/^paso:(\d+)$/, 'paso:s$1') : 'siguiente', fin: o.fin || '' }; }) };
      if (s.tipo === 'espera') n.espera = s.espera || '';
      if (s.tipo === 'comunicacion') n.comunicacion = { sentido: s.sentido || 'envia', con: s.con && s.con !== 'cliente' ? externoPor(s.con) : 'cliente', que: s.mensaje || '' };
      return n;
    });
    if (!p.disparador || !p.disparador.tipo) p.disparador = { tipo: pl.disparador, texto: pl.disparador_texto || '' };
    if (!p.resultado) p.resultado = pl.resultado || '';
  }
  function limpiarReferencias(id, tipo) {
    todosProcesos().forEach(function (x) {
      (x.p.pasos || []).forEach(function (s) {
        if (tipo === 'herr') s.con = (s.con || []).filter(function (h) { return h !== id; });
        else {
          if (s.quien === id) s.quien = '';
          if (s.comunicacion && s.comunicacion.con === id) s.comunicacion.con = '';
        }
      });
      if (tipo !== 'herr' && x.p.responsable === id) x.p.responsable = '';
    });
    AREAS.forEach(function (a) { if (E.areas[a.id].responsable === id) E.areas[a.id].responsable = ''; });
  }

  var ACCIONES = {
    'cargar': function () { document.getElementById('cargar-archivo').click(); },
    'borrar-todo': function () { if (confirm('¿Seguro? Se borra todo lo que has contestado en este navegador.')) { E = nuevo(); UI = { seccion: 'inicio', abierto: {} }; guardar(); pintar(); } },
    'rol-rapido': function (d) { var r = ROLES_RAPIDOS[+d.i]; E.equipo.push({ id: sigId(E.equipo, 'r'), rol: r[0], personas: 1, area: r[1], vinculo: r[2] }); },
    'nuevo-rol': function () { E.equipo.push({ id: sigId(E.equipo, 'r'), rol: '', personas: 1 }); },
    'quitar-rol': function (d) { var r = E.equipo[+d.i]; if (!confirm('¿Quitar «' + (r.rol || 'este puesto') + '»? Se quitará también de los pasos donde aparezca.')) return false; limpiarReferencias(r.id, 'rol'); E.equipo.splice(+d.i, 1); },
    'externo-rapido': function (d) { var r = EXTERNOS_RAPIDOS[+d.i]; E.externos.push({ id: sigId(E.externos, 'x'), nombre: r[0], que_hace: r[1] }); },
    'nuevo-externo': function () { E.externos.push({ id: sigId(E.externos, 'x'), nombre: '', que_hace: '' }); },
    'quitar-externo': function (d) { var r = E.externos[+d.i]; if (!confirm('¿Quitar «' + (r.nombre || 'este') + '»?')) return false; limpiarReferencias(r.id, 'ext'); E.externos.splice(+d.i, 1); },
    'herr-rapida': function (d) { var h = HERR_RAPIDAS[+d.i]; E.herramientas.push({ id: sigId(E.herramientas, 'h'), nombre: h[0], categoria: h[1] }); },
    'nueva-herr': function () { E.herramientas.push({ id: sigId(E.herramientas, 'h'), nombre: '' }); },
    'quitar-herr': function (d) { var h = E.herramientas[+d.i]; if (!confirm('¿Quitar «' + (h.nombre || 'esta herramienta') + '»?')) return false; limpiarReferencias(h.id, 'herr'); E.herramientas.splice(+d.i, 1); },
    'hacerla-mia': function (d) { if (areasMias().indexOf(d.area) < 0) E.respondente.areas.push(d.area); },
    'elegir-proceso': function (d, el) {
      var area = UI.seccion;
      var lista = E.areas[area].procesos;
      var pos = lista.map(function (p) { return p.plantilla; }).indexOf(d.plantilla);
      if (el.checked && pos < 0) {
        var pl = (CATALOGO.procesos || []).filter(function (x) { return x.id === d.plantilla; })[0];
        lista.push({ id: d.plantilla, plantilla: d.plantilla, nombre: pl.nombre, disparador: {}, frecuencia: {}, pasos: [] });
        UI.abierto[area + ':' + d.plantilla] = true;
      } else if (!el.checked && pos >= 0) {
        if ((lista[pos].pasos || []).length && !confirm('Este proceso ya tiene pasos. ¿Quitarlo igualmente?')) { el.checked = true; return false; }
        lista.splice(pos, 1);
      }
    },
    'proceso-propio': function (d) {
      var nombre = prompt('¿Cómo se llama el proceso? Por ejemplo: «Alta de socios del gimnasio»');
      if (!nombre) return false;
      var lista = E.areas[d.area].procesos;
      var id = d.area + '-p' + (lista.filter(function (p) { return !p.plantilla; }).length + 1) + '-' + Date.now().toString(36).slice(-3);
      lista.push({ id: id, plantilla: null, nombre: nombre.trim(), disparador: {}, frecuencia: {}, pasos: [] });
      UI.abierto[d.area + ':' + id] = true;
    },
    'quitar-proceso': function (d) { var p = proc(d.area, d.i); if (!confirm('¿Quitar «' + p.nombre + '» y todo lo que has contado de él?')) return false; E.areas[d.area].procesos.splice(+d.i, 1); },
    'cargar-plantilla': function (d) { cargarPlantilla(d.area, d.i); },
    'nuevo-paso': function (d) { var p = proc(d.area, d.i); p.pasos = p.pasos || []; p.pasos.push(pasoVacio(p.pasos)); p.confirmado = false; },
    'insertar-paso': function (d) { var p = proc(d.area, d.i); p.pasos.splice(+d.j + 1, 0, pasoVacio(p.pasos)); p.confirmado = false; },
    'quitar-paso': function (d) {
      var p = proc(d.area, d.i); var s = p.pasos[+d.j];
      if ((s.que || '').trim() && !confirm('¿Borrar el paso «' + s.que + '»?')) return false;
      p.pasos.splice(+d.j, 1);
      p.pasos.forEach(function (x) { if (x.decision) x.decision.opciones.forEach(function (o) { if (o.destino === 'paso:' + s.id) o.destino = ''; }); });
      p.confirmado = false;
    },
    'subir-paso': function (d) { var p = proc(d.area, d.i); var j = +d.j; if (j > 0) { var t = p.pasos[j]; p.pasos[j] = p.pasos[j - 1]; p.pasos[j - 1] = t; p.confirmado = false; } },
    'bajar-paso': function (d) { var p = proc(d.area, d.i); var j = +d.j; if (j < p.pasos.length - 1) { var t = p.pasos[j]; p.pasos[j] = p.pasos[j + 1]; p.pasos[j + 1] = t; p.confirmado = false; } },
    'tipo-paso': function (d) {
      var s = proc(d.area, d.i).pasos[+d.j];
      s.tipo = d.tipo; delete s.sugerido;
      if (d.tipo === 'decision' && !s.decision) s.decision = { pregunta: s.que && /\?$/.test(s.que) ? s.que : '', opciones: [{ texto: 'Sí', destino: 'siguiente' }, { texto: 'No', destino: '' }] };
      if (d.tipo === 'comunicacion' && !s.comunicacion) s.comunicacion = { sentido: 'envia', con: 'cliente', que: '' };
      proc(d.area, d.i).confirmado = false;
    },
    'nueva-opcion': function (d) { var s = proc(d.area, d.i).pasos[+d.j]; s.decision = s.decision || { opciones: [] }; s.decision.opciones.push({ texto: '', destino: '' }); },
    'quitar-opcion': function (d) { proc(d.area, d.i).pasos[+d.j].decision.opciones.splice(+d.k, 1); },
    'aceptar-sugerido': function (d) { delete proc(d.area, d.i).pasos[+d.j].sugerido; },
    'confirmar': function (d) {
      var p = proc(d.area, d.i);
      if (p.pasos.some(function (s) { return s.sugerido; }) && !confirm('Quedan pasos sugeridos sin confirmar (en amarillo). ¿Los das todos por buenos tal como están?')) return false;
      p.pasos.forEach(function (s) { delete s.sugerido; });
      p.confirmado = true;
    },
    'desconfirmar': function (d) { proc(d.area, d.i).confirmado = false; },
    'descargar': function () {
      var nombre = 'respuestas-' + (E.empresa.nombre || 'empresa').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + (E.respondente.nombre || 'anonimo').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.json';
      var blob = new Blob([JSON.stringify(E, null, 2)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      aviso('Descargado: ' + nombre);
      return false;
    },
    'enviar-avance': function () { return ACCIONES['enviar-web']({ tipo: 'avance' }); },
    'enviar-web': function (d) {
      var avance = d && d.tipo === 'avance';
      E.envio = { tipo: avance ? 'avance' : 'completo', fecha: new Date().toISOString() };
      // Con el envío va también la lectura en texto: n8n la convierte en el PDF del email
      var cuerpo = JSON.stringify(Object.assign({}, E, { lectura: textoPlano() }));
      var ok = function () { aviso(avance ? 'Enviado lo que llevas. Sigue cuando quieras: el próximo envío sustituirá a este.' : 'Enviado. Gracias: ya lo tenemos.'); };
      fetch(MARCA.webhook_formulario, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: cuerpo })
        .then(function (r) { if (!r.ok) throw new Error(r.status); ok(); })
        .catch(function () {
          fetch(MARCA.webhook_formulario, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: cuerpo }).then(ok).catch(function () { aviso('No se ha podido enviar. Descarga el archivo y mándalo por email.'); });
        });
      return false;
    },
    'copiar-texto': function () {
      var t = textoPlano();
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { aviso('Copiado. Pégalo en un email o un WhatsApp.'); }).catch(function () {
        var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); aviso('Copiado.'); } catch (e) { aviso('No se ha podido copiar.'); } ta.remove();
      });
      return false;
    },
    'imprimir': function () { window.print(); return false; }
  };

  function textoPlano() {
    var L = [], em = E.empresa || {}, rs = E.respondente || {};
    var lista = function (a) { return (a || []).filter(Boolean).join(', '); };
    L.push('CUESTIONARIO DEL DIAGNÓSTICO · ' + (em.nombre || ''));
    L.push('Contesta: ' + (rs.nombre || '') + (rs.cargo ? ' (' + rs.cargo + ')' : ''));
    if (em.pais || em.actividad) L.push('Empresa: ' + [em.pais, em.actividad].filter(Boolean).join(' · '));
    if ((em.objetivos || []).length) L.push('Objetivos: ' + lista(em.objetivos));
    L.push('');
    L.push('Equipo: ' + (E.equipo || []).map(function (r) { return r.rol + ' (' + (r.personas || 1) + ')'; }).join(', '));
    if ((E.externos || []).length) L.push('De fuera: ' + E.externos.map(function (x) { return x.nombre; }).join(', '));
    L.push('Herramientas: ' + (E.herramientas || []).map(function (h) { return h.nombre; }).join(', '));
    todosProcesos().forEach(function (x) {
      var p = x.p; L.push(''); L.push('== ' + x.area.nombre.toUpperCase() + ' · ' + p.nombre + ' ==');
      var d = p.disparador || {}; L.push('Empieza: ' + (d.texto || etiqueta(O.disparador, d.tipo) || '?'));
      (p.pasos || []).forEach(function (s, k) {
        if (s.tipo === 'decision') L.push((k + 1) + '. [DECISIÓN] ' + ((s.decision || {}).pregunta || s.que) + ' → ' + ((s.decision || {}).opciones || []).map(function (o) { return o.texto + ': ' + (o.destino || '?') + (o.fin ? ' (' + o.fin + ')' : ''); }).join(' | '));
        else if (s.tipo === 'espera') L.push((k + 1) + '. [ESPERA] ' + (s.que || '') + (s.espera ? ' (' + s.espera + ')' : ''));
        else {
          var partes = [s.que || '?'], q = nombreQuien(s.quien);
          if (q) partes.push(q);
          if ((s.con || []).length) partes.push('con ' + s.con.map(nombreHerr).join(', '));
          if (s.tiempo) partes.push(etiqueta(O.tiempo, s.tiempo));
          if (s.dolor) partes.push('PROBLEMA: ' + s.dolor);
          L.push((k + 1) + '. ' + partes.join(' — '));
        }
      });
      L.push('Termina: ' + (p.resultado || '?'));
    });
    if (EXTRAS.length) {
      var nombreSec = function (id) { var x = SECCIONES.filter(function (z) { return z.id === id; })[0]; return x ? x.nombre : ({ seguridad: 'Datos, seguridad e IA', enviar: 'Para terminar' })[id] || id; };
      var vacias = 0, porSec = {}, orden = [];
      EXTRAS.forEach(function (q) {
        var v = (E.extra || {})[q.id], txt = Array.isArray(v) ? v.join(', ') : (v === undefined || v === null ? '' : String(v));
        if (!txt.trim()) { vacias++; return; }
        if (!porSec[q.seccion]) { porSec[q.seccion] = []; orden.push(q.seccion); }
        porSec[q.seccion].push(q.pregunta + '\n   ' + txt);
      });
      orden.forEach(function (sec) { L.push(''); L.push('== ' + nombreSec(sec).toUpperCase() + ' =='); porSec[sec].forEach(function (t) { L.push(t); }); });
      if (vacias) { L.push(''); L.push('(' + vacias + ' preguntas sin contestar todavía)'); }
    }
    if (E.comentarios) { L.push(''); L.push('== COMENTARIOS =='); L.push(E.comentarios); }
    return L.join('\n');
  }

  /* ---------- eventos ---------- */
  var cont = document.getElementById('seccion');
  function valor(el) {
    if (el.type === 'number') return el.value === '' ? '' : Number(el.value);
    return el.value;
  }
  function tocado(ruta) {
    // Si se edita un paso sugerido, deja de serlo; y cualquier cambio en los pasos pide reconfirmar.
    var m = ruta.match(/^areas\.(\w+)\.procesos\.(\d+)\.pasos\.(\d+)\./);
    if (m) {
      var p = proc(m[1], m[2]);
      var s = p.pasos[+m[3]];
      if (s && s.sugerido) { delete s.sugerido; var tarj = document.querySelector('[data-paso="' + m[1] + ':' + m[2] + ':' + m[3] + '"]'); if (tarj) { tarj.classList.remove('sugerido'); var e1 = tarj.querySelector('.etq-sugerido'); if (e1) e1.remove(); var b1 = tarj.querySelector('[data-accion="aceptar-sugerido"]'); if (b1) b1.remove(); } }
      p.confirmado = false;
    }
  }
  var refresco = null;
  function refrescarProceso(ruta) {
    var m = ruta.match(/^areas\.(\w+)\.procesos\.(\d+)\./);
    if (!m) return;
    clearTimeout(refresco);
    refresco = setTimeout(function () {
      var p = proc(m[1], m[2]);
      if (!p) return;
      var r = document.getElementById('relato-' + m[1] + '-' + m[2]);
      if (r) r.innerHTML = relato(p);
      var det = document.querySelector('details.proceso[data-proceso="' + m[1] + ':' + p.id + '"] > summary');
      if (det) { var est = estadoProceso(p); det.querySelector('b').textContent = p.nombre || 'Proceso sin nombre'; var e2 = det.querySelector('.estado'); e2.className = 'estado ' + est[0]; e2.textContent = est[1]; }
    }, 500);
  }
  cont.addEventListener('input', function (ev) {
    var el = ev.target;
    var ruta = el.getAttribute('data-campo');
    if (!ruta || el.type === 'radio' || el.tagName === 'SELECT') return;
    poner(ruta, valor(el));
    tocado(ruta);
    guardar();
    pintarIndice();
    refrescarProceso(ruta);
  });
  cont.addEventListener('change', function (ev) {
    var el = ev.target;
    var ruta = el.getAttribute('data-campo');
    if (ruta && (el.type === 'radio' || el.tagName === 'SELECT')) {
      poner(ruta, el.value);
      tocado(ruta);
      guardar();
      pintar(true);
      return;
    }
    var multi = el.getAttribute('data-multi');
    if (multi) {
      var actual = (leer(multi) || []).slice();
      var v = el.value;
      if (el.checked) {
        var max = +el.getAttribute('data-max');
        if (max && actual.length >= max) { el.checked = false; aviso('Como mucho ' + max + '.'); return; }
        if (v === 'nose' || v === 'no' || v === 'ninguno' || v === 'ninguna' || v === 'nada' || v === 'no_tarjeta') actual = [v];
        else actual = actual.filter(function (x) { return ['nose', 'no', 'ninguno', 'ninguna', 'nada', 'no_tarjeta'].indexOf(x) < 0; }).concat([v]);
      } else actual = actual.filter(function (x) { return x !== v; });
      poner(multi, actual);
      tocado(multi + '.');
      guardar();
      pintar(true);
      return;
    }
    var bool = el.getAttribute('data-bool');
    if (bool) { poner(bool, el.checked); guardar(); }
    if (el.getAttribute('data-accion') === 'elegir-proceso') ejecutarAccion(el);
  });
  cont.addEventListener('toggle', function (ev) {
    var d = ev.target;
    if (d.matches && d.matches('details.proceso')) UI.abierto[d.getAttribute('data-proceso')] = d.open;
  }, true);
  function ejecutarAccion(el) {
    var accion = el.getAttribute('data-accion');
    var f = ACCIONES[accion];
    if (!f) return;
    var d = {}; Array.prototype.slice.call(el.attributes).forEach(function (a) { if (a.name.indexOf('data-') === 0) d[a.name.slice(5)] = a.value; });
    var r = f(d, el);
    if (r === false) return;
    guardar();
    pintar(true);
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-ir')) { ir(b.getAttribute('data-ir')); return; }
    if (b.hasAttribute('data-accion')) { ev.preventDefault(); ejecutarAccion(b); }
  });
  document.getElementById('anterior').addEventListener('click', function () { var k = SECCIONES.map(function (s) { return s.id; }).indexOf(UI.seccion); if (k > 0) ir(SECCIONES[k - 1].id); });
  document.getElementById('siguiente').addEventListener('click', function () { var k = SECCIONES.map(function (s) { return s.id; }).indexOf(UI.seccion); if (k < SECCIONES.length - 1) ir(SECCIONES[k + 1].id); });
  document.getElementById('cargar-archivo').addEventListener('change', function (ev) {
    var f = ev.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (String(d.formato || '').indexOf('respuestas-diagnostico/') !== 0 || !d.areas) throw new Error('formato');
        if (!confirm('Se va a sustituir lo que hay en este navegador por el archivo «' + f.name + '». ¿Seguir?')) return;
        var base = nuevo();
        AREAS.forEach(function (a) { if (!d.areas[a.id]) d.areas[a.id] = base.areas[a.id]; });
        E = Object.assign(base, d);
        if (!E.extra) E.extra = {};
        guardar(); pintar(); aviso('Archivo cargado.');
      } catch (e) { aviso('Ese archivo no es de este cuestionario.'); }
      ev.target.value = '';
    };
    r.readAsText(f);
  });

  /* ---------- arranque ---------- */
  if (!cargarGuardado()) E = nuevo();
  if (!E.extra) E.extra = {};
  AREAS.forEach(function (a) { if (!E.areas[a.id]) E.areas[a.id] = { responsable: '', notas: '', procesos: [] }; });
  if (MARCA.cliente && !E.empresa.nombre) E.empresa.nombre = MARCA.cliente;
  pintarCabecera();
  pintar();
  window.CUESTIONARIO = { estado: function () { return E; }, ir: ir };
})();
</script>
