<svg class="ilu" viewBox="0 0 400 500" role="img" aria-label="Persona tranquila en su oficina mientras la IA le hace los papeles" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ilu-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#103430"/><stop offset="1" stop-color="#081613"/></linearGradient>
    <radialGradient id="ilu-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3ee6c8" stop-opacity=".28"/><stop offset="1" stop-color="#3ee6c8" stop-opacity="0"/></radialGradient>
    <g id="ilu-paper"><rect x="-16" y="-20" width="32" height="40" rx="3" fill="#eaf4f0"/><rect x="-10" y="-12" width="20" height="3" rx="1.5" fill="#9fb8af"/><rect x="-10" y="-5" width="16" height="3" rx="1.5" fill="#9fb8af"/><rect x="-10" y="2" width="20" height="3" rx="1.5" fill="#9fb8af"/><rect x="-10" y="9" width="12" height="3" rx="1.5" fill="#9fb8af"/></g>
  </defs>
  <rect width="400" height="500" fill="url(#ilu-bg)"/>
  <!-- ventana con el monte -->
  <rect x="36" y="44" width="150" height="118" rx="10" fill="#0c2421" stroke="rgba(62,230,200,.25)" stroke-width="2"/>
  <path d="M38 150 L80 104 L100 122 L128 88 L184 150 Z" fill="#14403a"/>
  <path d="M128 88 L140 102 L132 104 L122 96 Z" fill="#9fb8af" opacity=".6"/>
  <line x1="111" y1="46" x2="111" y2="160" stroke="rgba(62,230,200,.18)" stroke-width="2"/>
  <!-- brillo detrás de la pantalla -->
  <circle cx="275" cy="265" r="150" fill="url(#ilu-glow)"/>
  <!-- papeles volando hacia la pantalla -->
  <path d="M40 210 C 90 170, 170 170, 230 232" fill="none" stroke="#3ee6c8" stroke-width="2" stroke-dasharray="5 7" opacity=".5"/>
  <g class="ilu-p p1"><use href="#ilu-paper" transform="translate(52 205) rotate(-14)"/></g>
  <g class="ilu-p p2"><use href="#ilu-paper" transform="translate(118 180) rotate(8) scale(.85)"/></g>
  <g class="ilu-p p3"><use href="#ilu-paper" transform="translate(178 192) rotate(18) scale(.7)" opacity=".8"/></g>
  <!-- pantalla -->
  <rect x="190" y="208" width="176" height="120" rx="12" fill="#0c1d1a" stroke="#3ee6c8" stroke-width="2.5"/>
  <rect x="206" y="222" width="54" height="16" rx="8" fill="#2d9494"/>
  <text x="233" y="234" text-anchor="middle" font-family="Outfit, sans-serif" font-size="11" font-weight="700" fill="#eaf4f0">IA</text>
  <g font-family="Outfit, sans-serif" font-size="10" fill="#eaf4f0">
    <circle cx="214" cy="257" r="7" fill="#3ee6c8"/><path d="M210.5 257 l2.5 2.5 l4.5 -5" stroke="#06110f" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="228" y="253" width="112" height="7" rx="3.5" fill="#9fb8af" opacity=".55"/>
    <circle cx="214" cy="279" r="7" fill="#3ee6c8"/><path d="M210.5 279 l2.5 2.5 l4.5 -5" stroke="#06110f" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="228" y="275" width="92" height="7" rx="3.5" fill="#9fb8af" opacity=".55"/>
    <circle cx="214" cy="301" r="7" fill="none" stroke="#3ee6c8" stroke-width="2" class="ilu-spin" stroke-dasharray="30 14"/><rect x="228" y="297" width="70" height="7" rx="3.5" fill="#9fb8af" opacity=".35"/>
  </g>
  <rect x="270" y="328" width="16" height="24" fill="#1d4a45"/>
  <rect x="246" y="350" width="64" height="8" rx="4" fill="#1d4a45"/>
  <!-- mesa -->
  <rect x="14" y="358" width="372" height="14" rx="7" fill="#1f5a54"/>
  <rect x="44" y="372" width="10" height="128" fill="#14403a"/>
  <rect x="346" y="372" width="10" height="128" fill="#14403a"/>
  <!-- planta -->
  <rect x="336" y="326" width="28" height="32" rx="5" fill="#2d9494"/>
  <path d="M350 326 C 336 300, 326 296, 322 284 C 340 288, 348 300, 350 326 Z" fill="#3f8f5b"/>
  <path d="M350 326 C 360 298, 372 292, 380 282 C 378 302, 362 312, 350 326 Z" fill="#3f8f5b"/>
  <path d="M350 326 C 348 300, 352 284, 350 270 C 358 286, 356 306, 350 326 Z" fill="#5cb07a"/>
  <!-- silla -->
  <rect x="56" y="244" width="15" height="104" rx="7" fill="#14403a" transform="rotate(-10 63 296)"/>
  <rect x="62" y="336" width="96" height="13" rx="6" fill="#14403a"/>
  <rect x="104" y="349" width="9" height="74" fill="#0f302c"/>
  <rect x="72" y="420" width="74" height="7" rx="3.5" fill="#0f302c"/>
  <!-- persona -->
  <path d="M108 340 L176 342 L184 410" fill="none" stroke="#173a52" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="192" cy="416" rx="17" ry="7" fill="#0b1513"/>
  <path d="M84 340 Q 74 292 92 256 Q 118 236 142 258 Q 150 298 152 340 Z" fill="#2d9494"/>
  <circle cx="111" cy="226" r="23" fill="#f0cfae"/>
  <path d="M88 224 Q 88 198 112 199 Q 136 199 135 220 Q 126 210 112 212 Q 98 212 88 224 Z" fill="#5a3b26"/>
  <path d="M117 230 q 6 5 11 0" stroke="#6b4a35" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="122" cy="222" r="2" fill="#2b1d14"/>
  <!-- brazo con el café -->
  <path d="M132 268 Q 160 300 166 286 Q 168 274 158 266" fill="none" stroke="#2d9494" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="158" cy="266" r="7" fill="#f0cfae"/>
  <rect x="152" y="246" width="17" height="21" rx="3" fill="#eaf4f0"/>
  <path d="M169 251 q 7 0 7 6 q 0 6 -7 6" fill="none" stroke="#eaf4f0" stroke-width="3"/>
  <path class="ilu-steam" d="M157 240 q -4 -7 0 -13 q 4 -6 0 -12 M164 240 q -4 -7 0 -13 q 4 -6 0 -12" fill="none" stroke="#9fb8af" stroke-width="2" stroke-linecap="round" opacity=".6"/>
</svg>
