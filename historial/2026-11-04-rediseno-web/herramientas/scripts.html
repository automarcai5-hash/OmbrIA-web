  <script>
    var burger = document.getElementById('burger');
    burger.addEventListener('click', function () {
      var open = document.getElementById('menu').classList.toggle('open');
      burger.setAttribute('aria-expanded', open);
    });
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e, i) {
        if (e.isIntersecting) { setTimeout(function () { e.target.classList.add('visible'); }, i * 70); obs.unobserve(e.target); }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(function (r) { obs.observe(r); });
  </script>
  <script src="/assets/utm.js"></script>
